utiful places in London: Big Ben, the Tower of London, Buckingham Palace. People in the UK eat fish and chips. English people are polite and friendly.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"47\">\n<ol>\n<li>What is the capital of Russia? — <input class=\"ans\" data-a=\"moscow\" style=\"width:120px\"/></li>\n<li>What is the capital of the UK? — <input class=\"ans\" data-a=\"london\" style=\"width:120px\"/></li>\n<li>What do people eat in Russia? — <input class=\"ans\" data-a=\"borsch\" style=\"width:110px\"/>, pancakes, kasha</li>\n<li>What do people eat in the UK? — Fish and <input class=\"ans\" data-a=\"chips\" style=\"width:100px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> написать о России (5–7 предложений).</div>\n</section>"}, {"block": 4, "num": "48", "icon": "🎓", "title": "Итоговый тест", "html": "<section class=\"lesson\" data-lesson=\"48\" id=\"l48\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">48</span><h2>Итоговый тест</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: проверить всё, что выучили за 48 уроков</p>\n<div class=\"rule\">\n<h3>📖 Итоговое повторение</h3>\n<p>Все главные правила за 4 блока:</p>\n<ul>\n<li><b>To be:</b> am / is / are</li>\n<li><b>Have got:</b> have / has got</li>\n<li><b>Can:</b> одинаков для всех</li>\n<li><b>Present Simple:</b> He/She/It + -s</li>\n<li><b>Present Continuous:</b> am/is/are + Ving</li>\n<li><b>There is/are</b></li>\n<li><b>Was/Were</b></li>\n<li><b>Past Simple:</b> -ed и irregular (V2)</li>\n<li><b>Comparatives:</b> -er, better/worse</li>\n<li><b>Modal:</b> must / mustn't / should / shouldn't</li>\n<li><b>Will / Going to / Present Perfect</b></li>\n</ul>\n</div>\n<div class=\"block\">\n<h3>Итоговый тест</h3>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>1. Вставь am / is / are</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"am\"/> a pupil.</li>\n<li>She <input class=\"ans\" data-a=\"is\"/> from Russia.</li>\n<li>They <input class=\"ans\" data-a=\"are\"/> friends.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>2. Вставь have / has</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"have\"/> got a cat.</li>\n<li>She <input class=\"ans\" data-a=\"has\"/> got a dog.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>3. Вставь can / can't</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"can\"/> swim.</li>\n<li>She <input class=\"ans\" data-a=\"can't|cant\"/> sing.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>4. Вставь like / likes</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"like\"/> apples.</li>\n<li>She <input class=\"ans\" data-a=\"likes\"/> cats.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>5. Вставь am / is / are (Present Continuous)</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"am\"/> playing.</li>\n<li>She <input class=\"ans\" data-a=\"is\"/> reading.</li>\n<li>They <input class=\"ans\" data-a=\"are\"/> singing.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>6. Вставь is / are (There is / There are)</h4>\n<ol>\n<li>There <input class=\"ans\" data-a=\"is\"/> a table.</li>\n<li>There <input class=\"ans\" data-a=\"are\"/> books.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>7. Вставь was / were</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"was\"/> at school yesterday.</li>\n<li>They <input class=\"ans\" data-a=\"were\"/> at home.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>8. Вставь неправильный глагол</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"went\"/> (go) to the park.</li>\n<li>She <input class=\"ans\" data-a=\"saw\"/> (see) a film.</li>\n<li>He <input class=\"ans\" data-a=\"had\"/> (have) breakfast.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>9. Вставь сравнительную степень</h4>\n<ol>\n<li>tall → <input class=\"ans\" data-a=\"taller\"/></li>\n<li>big → <input class=\"ans\" data-a=\"bigger\"/></li>\n<li>good → <input class=\"ans\" data-a=\"better\"/></li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>10. Вставь must / mustn't</h4>\n<ol>\n<li>You <input class=\"ans\" data-a=\"must\"/> wear a helmet.</li>\n<li>You <input class=\"ans\" data-a=\"mustn't|mustnt\"/> drop litter.</li>\n</ol>\n</div>\n<div class=\"exercise\" data-lesson=\"48\">\n<h4>11. Переведи на английский</h4>\n<ol>\n<li>Я ученик. → <input class=\"ans\" data-a=\"i am a pupil|i'm a pupil\" style=\"width:200px\"/></li>\n<li>У меня есть кот. → <input class=\"ans\" data-a=\"i have got a cat|i've got a cat\" style=\"width:220px\"/></li>\n<li>Она умеет плавать. → <input class=\"ans\" data-a=\"she can swim\" style=\"width:180px\"/></li>\n<li>Я сейчас читаю. → <input class=\"ans\" data-a=\"i am reading now|i'm reading now\" style=\"width:200px\"/></li>\n<li>Я пошёл в парк вчера. → <input class=\"ans\" data-a=\"i went to the park yesterday\" style=\"width:250px\"/></li>\n<li>Я пойду в парк завтра. → <input class=\"ans\" data-a=\"i will go to the park tomorrow\" style=\"width:250px\"/></li>\n<li>Я уже сделал домашнюю работу. → <input class=\"ans\" data-a=\"i have already done my homework\" style=\"width:280px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить всё</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>🏆 Поздравляем!</strong> Вы прошли всю программу. Вы готовы к 5 классу!</div>\n</section>"}];

        // USER STAR PROGRESS STATE
        let userProgress = JSON.parse(localStorage.getItem('starlight_progress') || '{}');

        function saveProgress(lessonNum, stars) {
            if (!userProgress[lessonNum] || stars > userProgress[lessonNum]) {
                userProgress[lessonNum] = stars;
                localStorage.setItem('starlight_progress', JSON.stringify(userProgress));
            }
        }

        function isLessonUnlocked(lessonNumStr) {
            const num = parseInt(lessonNumStr);
            if (num <= 1) return true;
            const prevNum = String(num - 1);
            return userProgress[prevNum] && userProgress[prevNum] > 0;
        }

        // EXACT SPEECH SYNTHESIS FROM СЛОВАРЬ.HTML
        const speech = window.speechSynthesis;
        const state = {
            activeCat: 'all',
            query: '',
            speaking: false,
            stopRequested: false
        };

        let voice = null;
        function pickVoice() {
            if (!speech) return;
            const voices = speech.getVoices();
            voice = voices.find(v => v.lang === 'en-GB' && /female|Google|Daniel|Serena/i.test(v.name))
                 || voices.find(v => v.lang === 'en-GB')
                 || voices.find(v => v.lang === 'en-US')
                 || voices[0] || null;
        }
        if (speech) {
            speech.onvoiceschanged = pickVoice;
            pickVoice();
        }

        function speak(word, btnEl, customRate) {
            if (!speech) return;
            speech.cancel();

            let clean = String(word || '').replace(/<[^>]*>/g, '').replace(/\[.*?\]/g, '').replace(/[^a-zA-Z\s',.?!-]/g, ' ').replace(/\s+/g, ' ').trim();
            if (!clean) clean = String(word || '').trim();

            const u = new SpeechSynthesisUtterance(clean);
            u.lang = 'en-GB';
            u.rate = customRate || 0.85;
            if (voice) u.voice = voice;

            if (btnEl) {
                const card = btnEl.closest('.card') || btnEl.closest('.word-card') || btnEl.closest('.ex') || btnEl.closest('.duo-task-card') || btnEl;
                if (card) card.classList.add('playing');
                u.onend = () => { if (card) card.classList.remove('playing'); };
                u.onerror = () => { if (card) card.classList.remove('playing'); };
            }

            speech.speak(u);
        }

        function speakAll(wordsList) {
            if (!speech || !wordsList.length) return;
            speech.cancel();
            state.stopRequested = false;
            state.speaking = true;
            document.getElementById('btnStop').disabled = false;

            let i = 0;

            const next = () => {
                if (state.stopRequested || i >= wordsList.length) {
                    state.speaking = false;
                    document.getElementById('btnStop').disabled = true;
                    document.querySelectorAll('.playing').forEach(c => c.classList.remove('playing'));
                    return;
                }
                const w = wordsList[i];
                const card = [...document.querySelectorAll('.card, .word-card')].find(c => c.dataset.en === w.en);
                if (card) {
                    card.classList.add('playing');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                speak(w.en, card, 0.85);
                i++;
                setTimeout(next, 1200);
            };
            next();
        }

        function stopAll() {
            state.stopRequested = true;
            if (speech) speech.cancel();
            document.getElementById('btnStop').disabled = true;
            document.querySelectorAll('.playing').forEach(c => c.classList.remove('playing'));
        }

        function playCategory(catId) {
            let list;
            if (catId) {
                list = WORDS.filter(w => w.c === catId);
            } else if (activeCategory !== 'all') {
                list = WORDS.filter(w => w.c === activeCategory);
            } else {
                list = WORDS;
            }
            speakAll(list);
        }

        // LESSON & SPA NAVIGATION
        let currentBlock = 1;
        let currentLessonNum = "1";
        let activeStepIdx = 0;
        let lessonMistakes = 0;
        let selectedAudioOption = null;
        let selectedMatchPair = { left: null, right: null };

        function showBlock(blockNum, evt) {
            currentBlock = blockNum;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('page-lessons').classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');

            const blockLessons = LESSONS.filter(l => l.block === currentBlock);
            if (blockLessons.length > 0) {
                const unlocked = blockLessons.find(l => isLessonUnlocked(l.num)) || blockLessons[0];
                currentLessonNum = unlocked.num;
            }

            renderSidebar();
            renderLesson();
        }

        function showVocab(evt) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('page-vocab').classList.add('active');
            if (evt && evt.target) evt.target.classList.add('active');

            renderCategories();
            filterVocab();
        }

        function renderSidebar() {
            const sidebarTitle = document.getElementById('sidebar-block-title');
            const titles = {
                1: 'Блок 1. Фундамент (1–12)',
                2: 'Блок 2. Расширение (13–24)',
                3: 'Блок 3. Закрепление (25–36)',
                4: 'Блок 4. Выход на 5 класс (37–48)'
            };
            sidebarTitle.innerText = titles[currentBlock] || `Блок ${currentBlock}`;

            const sidebarNav = document.getElementById('sidebar-lessons');
            const blockLessons = LESSONS.filter(l => l.block === currentBlock);

            sidebarNav.innerHTML = blockLessons.map(l => {
                const unlocked = isLessonUnlocked(l.num);
                const stars = userProgress[l.num] ? '⭐'.repeat(userProgress[l.num]) : '';
                const icon = !unlocked ? '🔒' : (stars || '▶');
                const lockClass = !unlocked ? 'locked' : (stars ? 'done' : '');

                return `
                <div class="lesson-link ${String(l.num) === String(currentLessonNum) ? 'active' : ''} ${lockClass}" onclick="selectLesson('${l.num}')">
                    <span>Урок ${l.num}</span>
                    <span class="lesson-stars">${icon}</span>
                </div>
            `}).join('');
        }

        function selectLesson(num) {
            if (!isLessonUnlocked(num)) {
                alert(`🔒 Урок ${num} заблокирован! Пройдите Урок ${parseInt(num)-1}, чтобы открыть его.`);
                return;
            }
            currentLessonNum = String(num);
            activeStepIdx = 0;
            lessonMistakes = 0;
            renderSidebar();
            renderLesson();
        }

        // CLEAN & TOPIC-SMART DISTRACTORS
        function generateTopicDistractors(targetRU, lessonNum) {
            const num = parseInt(lessonNum);
            const cleanTarget = targetRU.replace(/\[.*?\]/g, '').trim();

            if (num === 1) return ["собака", "кровать", "птица", "мышь"].filter(w => w !== cleanTarget).slice(0, 3);
            if (num === 2) return ["велосипед", "машина", "сидеть", "имя"].filter(w => w !== cleanTarget).slice(0, 3);
            if (num === 3) return ["часы", "корабль", "стул", "дерево"].filter(w => w !== cleanTarget).slice(0, 3);
            if (num === 4) return ["машина", "дерево", "чай", "книга"].filter(w => w !== cleanTarget).slice(0, 3);

            if (num <= 10) {
                const pool = ["Это мой старший брат.", "У меня большая семья.", "Моя мама — учительница.", "У неё есть маленькая собака.", "Его отец работает в школе."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 15) {
                const pool = ["Птицы умеют высоко летать.", "Рыбы умеют быстро плавать.", "Я не умею играть на пианино.", "Он отлично умеет бегать.", "Мы умеем танцевать."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 20) {
                const pool = ["Я очень люблю мороженое.", "Он не пьет холодное молоко.", "Ты любишь свежие бананы?", "На столе лежит торт.", "Мы едим пиццу по выходным."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 25) {
                const pool = ["В комнате стоит диван.", "На столе лежит книга.", "Под кроватью сидит кот.", "В саду растут цветы.", "На стене нет картин."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 30) {
                const pool = ["Я читаю интересную книгу сейчас.", "Она смотрит телевизор в комнате.", "Смотри! Кот спит на диване.", "Они сейчас играют в футбол.", "Мы пишем письмо другу."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 35) {
                const pool = ["Я хожу в школу каждый день.", "Он обычно встает в 7 часов.", "Мы играем в теннис по субботам.", "Она не любит холодный сок.", "Ты читаешь книги по вечерам?"];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            if (num <= 60) {
                const pool = ["Вчера я ходил в музей.", "Мы видели птицу в парке.", "Она вчера не смотрела кино.", "Ты был вчера дома?", "Мама вчера приготовила вкусный торт."];
                return pool.filter(p => p !== cleanTarget).slice(0, 3);
            }
            const generalPool = ["Вчера мы ходили в парк.", "Завтра я буду отдыхать.", "Я люблю читать книги.", "Мы учим английский язык."];
            return generalPool.filter(p => p !== cleanTarget).slice(0, 3);
        }

        function renderLesson() {
            const lessonObj = LESSONS.find(l => l.block === currentBlock && String(l.num) === String(currentLessonNum));
            const display = document.getElementById('lesson-display');

            if (!lessonObj) {
                display.innerHTML = '<div>Урок не найден</div>';
                return;
            }

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = lessonObj.html;

            const exercises = tempDiv.querySelectorAll('.exercise');
            const totalSteps = exercises.length + 3;
            const pct = Math.round(((activeStepIdx + 1) / totalSteps) * 100);

            // Clean .ex examples and bind exact play button from словарь.html
            tempDiv.querySelectorAll('.ex').forEach(ex => {
                const enSpan = ex.querySelector('.en');
                if (enSpan) {
                    const rawTxt = enSpan.innerText.replace('🔊','').trim();
                    ex.setAttribute('onclick', `speak('${rawTxt.replace(/'/g, "\\\'")}', this)`);
                    ex.style.cursor = 'pointer';
                    if (!ex.querySelector('.play')) {
                        const playBtn = document.createElement('button');
                        playBtn.className = 'play';
                        playBtn.title = 'Прослушать';
                        playBtn.innerHTML = '🔊';
                        playBtn.onclick = (e) => { e.stopPropagation(); speak(rawTxt, ex); };
                        ex.appendChild(playBtn);
                    }
                }
            });

            // Bind Flip Cards click handlers
            tempDiv.querySelectorAll('.flip').forEach(card => {
                card.onclick = () => card.classList.toggle('flipped');
            });

            const headHTML = tempDiv.querySelector('.lesson-head')?.outerHTML || `<h2>Урок ${currentLessonNum}</h2>`;
            const goalHTML = tempDiv.querySelector('.goal')?.outerHTML || '';
            const ruleHTML = tempDiv.querySelector('.rule')?.outerHTML || '';
            const flipHTML = tempDiv.querySelector('.flip-cards')?.outerHTML || tempDiv.querySelector('.block')?.outerHTML || '';

            // Extract example sentences & translations
            const exElements = [...tempDiv.querySelectorAll('.ex')];
            const sampleEN = exElements.length > 0 ? exElements[0].querySelector('.en')?.innerText.replace('🔊','').trim() : "cat";
            const rawRU = exElements.length > 0 ? exElements[0].querySelector('.ru')?.innerText.replace('—','').trim() : "кошка";
            const cleanRU = rawRU.replace(/\[.*?\]/g, '').trim() || rawRU;

            // Generate TOPIC-SMART OPTIONS
            const distractors = generateTopicDistractors(cleanRU, currentLessonNum);
            const audioOptions = [cleanRU, ...distractors].sort(() => Math.random() - 0.5);

            // Generate Pairs for Matching Game
            const matchPairs = exElements.slice(0, 4).map(e => ({
                en: e.querySelector('.en')?.innerText.replace('🔊','').trim() || "cat",
                ru: e.querySelector('.ru')?.innerText.replace(/—|\[.*?\]/g,'').trim() || "кошка"
            }));
            if (matchPairs.length < 3) {
                matchPairs.push({ en: "cat", ru: "кошка" }, { en: "dog", ru: "собака" }, { en: "bed", ru: "кровать" });
            }
            const matchLeft = matchPairs.map(p => p.en).sort(() => Math.random() - 0.5);
            const matchRight = matchPairs.map(p => p.ru).sort(() => Math.random() - 0.5);

            let stepsHTML = '';

            // STEP 0: Rule & Theory
            stepsHTML += `
                <div class="step-card ${activeStepIdx === 0 ? 'active' : ''}" id="step-0">
                    <div style="font-size:14px; font-weight:800; color:var(--accent-purple); margin-bottom:10px;">📖 ШАГ 1: ИЗУЧЕНИЕ ПРАВИЛА</div>
                    ${ruleHTML}
                    ${flipHTML}
                    <button class="check-btn" style="width:100%; margin-top:15px;" onclick="nextStep(1)">Понятно! Перейти к заданиям ➔</button>
                </div>
            `;

            // STEP 1: DUOLINGO AUDIO LISTENING COMPREHENSION
            stepsHTML += `
                <div class="step-card ${activeStepIdx === 1 ? 'active' : ''}" id="step-1">
                    <div class="duo-task-card">
                        <div class="duo-task-title">🎧 ШАГ 2: АУДИО-ЗАДАНИЕ (ПОСЛУШАЙ И ВЫБЕРИ)</div>
                        <div style="font-size:15px; color:#e2e8f0;">Нажмите кнопку ниже, чтобы прослушать слово или фразу, и выберите её правильный перевод:</div>

                        <div class="duo-audio-banner">
                            <button class="duo-audio-btn-big" onclick="speak('${sampleEN.replace(/'/g, "\\\'")}', this, 0.85)" title="Нормальная скорость">🔊</button>
                            <button class="duo-audio-btn-big" style="background:#475569!important;" onclick="speak('${sampleEN.replace(/'/g, "\\\'")}', this, 0.5)" title="Медленная скорость">🐢</button>
                            <span style="font-size:15px; font-weight:700; color:#38bdf8;">Нажмите 🔊, чтобы услышать запись</span>
                        </div>

                        <div class="duo-options-grid">
                            ${audioOptions.map((opt, idx) => `
                                <div class="duo-option-card" id="audio-opt-${idx}" onclick="selectAudioOption('${opt.replace(/'/g, "\\\'")}', 'audio-opt-${idx}')">${opt}</div>
                            `).join('')}
                        </div>

                        <button class="check-btn" onclick="checkAudioOption('${cleanRU.replace(/'/g, "\\\'")}')" style="width:100%;">Проверить ответ</button>
                        <div id="audio-feedback" class="feedback"></div>
                    </div>
                </div>
            `;

            // STEP 2: DUOLINGO MATCHING PAIRS GAME
            stepsHTML += `
                <div class="step-card ${activeStepIdx === 2 ? 'active' : ''}" id="step-2">
                    <div class="duo-task-card">
                        <div class="duo-task-title">🧩 ШАГ 3: НАЙДИ ПАРУ (MATCH PAIRS)</div>
                        <div style="font-size:15px; color:#e2e8f0;">Сопоставьте английское слово/фразу слева с её переводом справа:</div>

                        <div class="match-grid">
                            <div class="match-col">
                                ${matchLeft.map((en, idx) => `
                                    <div class="match-pill" id="match-l-${idx}" onclick="selectMatch('left', '${en.replace(/'/g, "\\\'")}', 'match-l-${idx}')">${en}</div>
                                `).join('')}
                            </div>
                            <div class="match-col">
                                ${matchRight.map((ru, idx) => `
                                    <div class="match-pill" id="match-r-${idx}" onclick="selectMatch('right', '${ru.replace(/'/g, "\\\'")}', 'match-r-${idx}')">${ru}</div>
                                `).join('')}
                            </div>
                        </div>

                        <div id="match-feedback" class="feedback"></div>
                    </div>
                </div>
            `;

            // STEPS 3+: Exercises from Block
            exercises.forEach((ex, idx) => {
                const stepNum = idx + 3;
                stepsHTML += `
                    <div class="step-card ${activeStepIdx === stepNum ? 'active' : ''}" id="step-${stepNum}">
                        <div style="font-size:14px; font-weight:800; color:var(--accent-yellow); margin-bottom:10px;">✍️ ШАГ ${stepNum + 1}: ПРАКТИЧЕСКОЕ ЗАДАНИЕ</div>
                        ${ex.outerHTML}
                    </div>
                `;
            });

            // VICTORY SCREEN
            const calculatedStars = lessonMistakes === 0 ? 3 : lessonMistakes <= 2 ? 2 : 1;
            const victoryHTML = `
                <div class="victory-card ${activeStepIdx >= totalSteps ? 'active' : ''}" id="victory-card">
                    <div class="victory-title">🎉 Урок ${currentLessonNum} успешно пройден!</div>
                    <div class="victory-stars">${'⭐'.repeat(calculatedStars)}</div>
                    <div style="font-size:16px; color:#e2e8f0; margin-bottom:20px;">
                        ${calculatedStars === 3 ? 'Идеальная работа! Ни одной ошибки! 🌟' : calculatedStars === 2 ? 'Отличный результат! Почти без ошибок! 👍' : 'Урок пройден! Продолжай тренироваться! 💪'}
                    </div>
                    <button class="check-btn" style="padding:14px 28px; font-size:16px;" onclick="goToNextLesson()">Следующий урок ➔</button>
                </div>
            `;

            display.innerHTML = `
                <div class="lesson-header">
                    <div class="duo-progress-wrap">
                        <div class="duo-progress-bar">
                            <div class="duo-progress-fill" style="width: ${pct}%;"></div>
                        </div>
                        <div class="duo-progress-text">Шаг ${Math.min(activeStepIdx + 1, totalSteps)} из ${totalSteps} (${pct}%)</div>
                    </div>
                </div>
                <div class="lesson-illustration-banner">
                    <div class="lesson-illustration-icon">${lessonObj.icon || '📚'}</div>
                    <div>
                        <div style="font-size:12px; font-weight:800; color:var(--accent-purple); text-transform:uppercase;">Блок ${lessonObj.block} • Урок ${lessonObj.num}</div>
                        <div style="font-size:18px; font-weight:800; color:#fff;">${lessonObj.title}</div>
                    </div>
                </div>
                ${headHTML}
                ${goalHTML}
                ${stepsHTML}
                ${victoryHTML}
            `;
        }

        function nextStep(stepIdx) {
            activeStepIdx = stepIdx;
            renderLesson();
        }

        function selectAudioOption(text, cardId) {
            selectedAudioOption = text;
            document.querySelectorAll('.duo-option-card').forEach(c => c.classList.remove('selected'));
            const card = document.getElementById(cardId);
            if (card) card.classList.add('selected');
        }

        function checkAudioOption(correctAns) {
            const fb = document.getElementById('audio-feedback');
            if (!selectedAudioOption) {
                fb.className = 'feedback bad';
                fb.innerText = '⚠️ Пожалуйста, выберите вариант ответа!';
                return;
            }

            if (selectedAudioOption === correctAns) {
                fb.className = 'feedback ok';
                fb.innerHTML = '✨ Правильно! Отличный слух!';
                setTimeout(() => {
                    selectedAudioOption = null;
                    nextStep(2);
                }, 1000);
            } else {
                lessonMistakes++;
                fb.className = 'feedback bad';
                fb.innerHTML = `❌ Попробуйте ещё раз! Правильный перевод: <b>${correctAns}</b>`;
            }
        }

        let matchedPairsCount = 0;

        function selectMatch(side, text, elId) {
            const el = document.getElementById(elId);
            if (side === 'left') {
                document.querySelectorAll('.match-col:first-child .match-pill').forEach(p => p.classList.remove('selected'));
                el.classList.add('selected');
                selectedMatchPair.left = { text, elId };
            } else {
                document.querySelectorAll('.match-col:last-child .match-pill').forEach(p => p.classList.remove('selected'));
                el.classList.add('selected');
                selectedMatchPair.right = { text, elId };
            }

            if (selectedMatchPair.left && selectedMatchPair.right) {
                checkMatchPair();
            }
        }

        function checkMatchPair() {
            const leftEl = document.getElementById(selectedMatchPair.left.elId);
            const rightEl = document.getElementById(selectedMatchPair.right.elId);
            const fb = document.getElementById('match-feedback');

            const exElements = [...document.querySelectorAll('.ex')];
            let isMatch = false;

            exElements.forEach(ex => {
                const en = ex.querySelector('.en')?.innerText.replace('🔊','').trim();
                const ru = ex.querySelector('.ru')?.innerText.replace(/—|\[.*?\]/g,'').trim();
                if (en === selectedMatchPair.left.text && ru === selectedMatchPair.right.text) {
                    isMatch = true;
                }
            });

            if (isMatch || selectedMatchPair.left.text.length > 0) {
                leftEl.classList.add('matched');
                rightEl.classList.add('matched');
                matchedPairsCount++;
                fb.className = 'feedback ok';
                fb.innerText = '✨ Найдена пара!';

                if (matchedPairsCount >= 3) {
                    setTimeout(() => {
                        matchedPairsCount = 0;
                        selectedMatchPair = { left: null, right: null };
                        nextStep(3);
                    }, 1000);
                }
            } else {
                lessonMistakes++;
                fb.className = 'feedback bad';
                fb.innerText = '❌ Не совпадает! Попробуйте другую пару.';
            }

            selectedMatchPair = { left: null, right: null };
        }

        function goToNextLesson() {
            const nextNum = String(parseInt(currentLessonNum) + 1);
            const nextLessonObj = LESSONS.find(l => String(l.num) === nextNum);
            if (nextLessonObj) {
                currentBlock = nextLessonObj.block;
                currentLessonNum = nextNum;
                activeStepIdx = 0;
                lessonMistakes = 0;
                renderSidebar();
                renderLesson();
            } else {
                alert('🎉 Поздравляем! Вы успешно прошли весь интерактивный курс!');
            }
        }

        // EXACT CHECK FUNCTIONS FROM BLOCK_1..4
        function checkInputs(btn) {
            const ex = btn.closest('.exercise');
            const inputs = ex.querySelectorAll('input.ans');
            let c = 0;
            inputs.forEach(i => {
                const v = (i.value || '').trim().toLowerCase().replace(/\s+/g, ' ');
                const ansList = (i.dataset.a || '').toLowerCase().split('|').map(a => a.trim());
                if (ansList.includes(v)) {
                    i.classList.add('correct');
                    i.classList.remove('wrong');
                    c++;
                } else {
                    i.classList.add('wrong');
                    i.classList.remove('correct');
                }
            });
            const fb = ex.querySelector('.feedback');
            if (fb) {
                fb.textContent = `Правильно: ${c} из ${inputs.length}`;
                fb.className = 'feedback ' + (c === inputs.length ? 'ok' : c > 0 ? 'partial' : 'bad');
            }

            if (c === inputs.length) {
                const totalSteps = document.querySelectorAll('.step-card').length;
                if (activeStepIdx + 1 < totalSteps) {
                    setTimeout(() => { nextStep(activeStepIdx + 1); }, 1000);
                } else {
                    const stars = lessonMistakes === 0 ? 3 : lessonMistakes <= 2 ? 2 : 1;
                    saveProgress(currentLessonNum, stars);
                    activeStepIdx = totalSteps;
                    renderSidebar();
                    renderLesson();
                }
            } else {
                lessonMistakes++;
            }
        }

        function checkRadios(btn) {
            const ex = btn.closest('.exercise');
            const names = [...new Set([...ex.querySelectorAll('input[type=radio]')].map(r => r.name))];
            let c = 0;
            names.forEach(n => {
                const sel = ex.querySelector(`input[name="${n}"]:checked`);
                const labels = ex.querySelectorAll(`input[name="${n}"]`);
                labels.forEach(r => r.closest('label').classList.remove('correct', 'wrong'));
                if (sel) {
                    const lbl = sel.closest('label');
                    if (sel.dataset.correct === "true") {
                        lbl.classList.add('correct');
                        c++;
                    } else {
                        lbl.classList.add('wrong');
                    }
                }
            });
            const fb = ex.querySelector('.feedback');
            if (fb) {
                fb.textContent = `Правильно: ${c} из ${names.length}`;
                fb.className = 'feedback ' + (c === names.length ? 'ok' : c > 0 ? 'partial' : 'bad');
            }

            if (c === names.length) {
                const totalSteps = document.querySelectorAll('.step-card').length;
                if (activeStepIdx + 1 < totalSteps) {
                    setTimeout(() => { nextStep(activeStepIdx + 1); }, 1000);
                } else {
                    const stars = lessonMistakes === 0 ? 3 : lessonMistakes <= 2 ? 2 : 1;
                    saveProgress(currentLessonNum, stars);
                    activeStepIdx = totalSteps;
                    renderSidebar();
                    renderLesson();
                }
            } else {
                lessonMistakes++;
            }
        }

        // EXACT VOCABULARY BANK CARD RENDERER FROM СЛОВАРЬ.HTML
        function esc(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

        function vocabCard(w) {
            const enEsc = esc(w.en).replace(/'/g, "&#39;");
            return `
                <div class="card" data-en="${esc(w.en)}" onclick="speak('${enEsc}', this)">
                    <div class="emoji">${w.e || '📖'}</div>
                    <div class="info">
                        <div class="en">${esc(w.en)}</div>
                        ${w.tr ? `<div class="tr">${esc(w.tr)}</div>` : ''}
                        <div class="ru">${esc(w.ru)}</div>
                    </div>
                    <button class="play" title="Прослушать" onclick="event.stopPropagation();speak('${enEsc}', this)">🔊</button>
                </div>
            `;
        }

        let activeCategory = 'all';

        function renderCategories() {
            const pillsContainer = document.getElementById('category-pills');
            const allPill = `<div class="pill ${activeCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">🌟 Все слова (${WORDS.length})</div>`;
            const catPills = CATEGORIES.map(cat => {
                const count = WORDS.filter(w => w.c === cat.id).length;
                return `<div class="pill ${cat.id === activeCategory ? 'active' : ''}" onclick="setCategory('${cat.id}')">${cat.icon || '📖'} ${cat.name} (${count})</div>`;
            }).join('');
            pillsContainer.innerHTML = allPill + catPills;
        }

        function setCategory(catId) {
            activeCategory = catId;
            renderCategories();
            filterVocab();
        }

        function filterVocab() {
            const search = document.getElementById('vocab-search').value.toLowerCase();
            const grid = document.getElementById('vocab-grid');

            const filtered = WORDS.filter(w => {
                const matchesCat = activeCategory === 'all' || w.c === activeCategory;
                const matchesSearch = w.en.toLowerCase().includes(search) || w.ru.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            grid.innerHTML = filtered.map(vocabCard).join('');
        }

        // ===== IPA VIRTUAL KEYBOARD =====
        let ipaActiveInput = null;

        function ipaInsert(text) {
            if (!ipaActiveInput) return;
            const start = ipaActiveInput.selectionStart;
            const end = ipaActiveInput.selectionEnd;
            ipaActiveInput.value = ipaActiveInput.value.slice(0, start) + text + ipaActiveInput.value.slice(end);
            ipaActiveInput.selectionStart = ipaActiveInput.selectionEnd = start + text.length;
            ipaActiveInput.focus();
            ipaActiveInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function ipaClear() {
            if (!ipaActiveInput) return;
            ipaActiveInput.value = '';
            ipaActiveInput.focus();
            ipaActiveInput.dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Show IPA keyboard when a transcription input is focused
        document.addEventListener('focusin', (e) => {
            if (e.target.matches('input.ans[data-a*="["]')) {
                ipaActiveInput = e.target;
                const kb = document.getElementById('ipa-keyboard');
                if (kb) kb.classList.add('visible');
            } else if (!e.target.closest('#ipa-keyboard')) {
                const kb = document.getElementById('ipa-keyboard');
                if (kb) kb.classList.remove('visible');
            }
        });

        // Keep IPA keyboard open while clicking its buttons; keep focus on the transcription input
        const ipaKb = document.getElementById('ipa-keyboard');
        if (ipaKb) {
            ipaKb.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (ipaActiveInput) ipaActiveInput.focus();
            });
        }

        // Hide IPA keyboard when clicking outside both the transcription input and the keyboard
        document.addEventListener('mousedown', (e) => {
            const kb = document.getElementById('ipa-keyboard');
            if (!kb || !kb.classList.contains('visible')) return;
            if (!e.target.matches('input.ans[data-a*="["]') && !kb.contains(e.target)) {
                kb.classList.remove('visible');
                ipaActiveInput = null;
            }
        });

        // INITIAL LOAD
        renderSidebar();
        renderLesson();
    </script>
</body>
</html>
