<li>Есть ли яблоки? → <input class=\"ans\" data-a=\"are there any apples\" style=\"width:200px\"/></li>\n<li>Что ты делаешь сейчас? → <input class=\"ans\" data-a=\"what are you doing now\" style=\"width:230px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> описать свою комнату 10 предложениями.</div>\n</section>"}, {"block": 2, "num": "19", "icon": "🍌", "title": "Was / Were", "html": "<section class=\"lesson\" data-lesson=\"19\" id=\"l19\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">19</span><h2>Was / Were</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: говорить о прошлом с was/were</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Was / Were</b> — это прошедшая форма глагола <b>to be</b> (am/is → was, are → were).</p>\n<table>\n<tr><th>Местоимение</th><th>Форма</th><th>Пример</th></tr>\n<tr><td>I / He / She / It</td><td>was</td><td>I was at school.</td></tr>\n<tr><td>We / You / They</td><td>were</td><td>They were at home.</td></tr>\n</table>\n<div class=\"ex\" onclick=\"speak('I was at school yesterday.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I was at school yesterday.</span> — <span class=\"ru\">Я был в школе вчера.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I was at school yesterday.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('They were at home.', this)\" style=\"cursor: pointer;\"><span class=\"en\">They were at home.</span> — <span class=\"ru\">Они были дома.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('They were at home.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('She was at the cinema.', this)\" style=\"cursor: pointer;\"><span class=\"en\">She was at the cinema.</span> — <span class=\"ru\">Она была в кино.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('She was at the cinema.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ Слова-подсказки: <b>yesterday, last week, two days ago</b>.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"19\">\n<h4>Вставь was / were</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"was\"/> at school.</li>\n<li>They <input class=\"ans\" data-a=\"were\"/> at home.</li>\n<li>She <input class=\"ans\" data-a=\"was\"/> at the cinema.</li>\n<li>We <input class=\"ans\" data-a=\"were\"/> at the park.</li>\n<li>He <input class=\"ans\" data-a=\"was\"/> at work.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> 5 предложений: где ты был вчера.</div>\n</section>"}, {"block": 2, "num": "20", "icon": "🏆", "title": "Was/were: отрицание и вопрос", "html": "<section class=\"lesson\" data-lesson=\"20\" id=\"l20\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">20</span><h2>Was/were: отрицание и вопрос</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: строить отрицания и вопросы</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Отрицание:</b> добавляем <b>not</b> → wasn't / weren't.</p>\n<div class=\"ex\" onclick=\"speak('I wasn\\'t at home.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I wasn't at home.</span> — <span class=\"ru\">Меня не было дома.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I wasn\\'t at home.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('They weren\\'t at school.', this)\" style=\"cursor: pointer;\"><span class=\"en\">They weren't at school.</span> — <span class=\"ru\">Их не было в школе.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('They weren\\'t at school.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Вопрос:</b> was/were ставим в начало.</p>\n<div class=\"ex\" onclick=\"speak('Was she at school?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Was she at school?</span> — <span class=\"ru\">Она была в школе?</span> — Yes, she was. / No, she wasn't.<button class=\"play\" onclick=\"event.stopPropagation();speak('Was she at school?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('Were they at home?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Were they at home?</span> — <span class=\"ru\">Они были дома?</span> — Yes, they were. / No, they weren't.<button class=\"play\" onclick=\"event.stopPropagation();speak('Were they at home?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ В вопросе порядок слов меняется, а глагол остаётся в той же форме.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"20\">\n<h4>Вставь wasn't / weren't / Was / Were</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"wasn't|wasnt\"/> at home.</li>\n<li>They <input class=\"ans\" data-a=\"weren't|werent\"/> at school.</li>\n<li><input class=\"ans\" data-a=\"was\"/> she at school?</li>\n<li><input class=\"ans\" data-a=\"were\"/> they at home?</li>\n<li>She <input class=\"ans\" data-a=\"wasn't|wasnt\"/> at the park.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> 5 вопросов и ответы.</div>\n</section>"}, {"block": 2, "num": "21", "icon": "🛏️", "title": "There was / There were", "html": "<section class=\"lesson\" data-lesson=\"21\" id=\"l21\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">21</span><h2>There was / There were</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: говорить о том, что было в прошлом</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Прошлая форма <b>There is/are</b>: <b>There was</b> (один предмет в прошлом) · <b>There were</b> (несколько).</p>\n<div class=\"ex\" onclick=\"speak('There was a table.', this)\" style=\"cursor: pointer;\"><span class=\"en\">There was a table.</span> — <span class=\"ru\">Был стол.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('There was a table.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('There were books.', this)\" style=\"cursor: pointer;\"><span class=\"en\">There were books.</span> — <span class=\"ru\">Были книги.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('There were books.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Вопрос:</b> Was there...? Were there...?</p>\n<div class=\"ex\" onclick=\"speak('Was there a cat?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Was there a cat?</span> — <span class=\"ru\">Была кошка?</span> — Yes, there was.<button class=\"play\" onclick=\"event.stopPropagation();speak('Was there a cat?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('Were there books?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Were there books?</span> — <span class=\"ru\">Были книги?</span> — No, there weren't.<button class=\"play\" onclick=\"event.stopPropagation();speak('Were there books?', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"21\">\n<h4>Вставь was / were</h4>\n<ol>\n<li>There <input class=\"ans\" data-a=\"was\"/> a table.</li>\n<li>There <input class=\"ans\" data-a=\"were\"/> books.</li>\n<li><input class=\"ans\" data-a=\"was\"/> there a cat?</li>\n<li>There <input class=\"ans\" data-a=\"were\"/> chairs.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> 5 предложений: There was... There were...</div>\n</section>"}, {"block": 2, "num": "22", "icon": "🛋️", "title": "Past Simple: regular verbs (-ed)", "html": "<section class=\"lesson\" data-lesson=\"22\" id=\"l22\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">22</span><h2>Past Simple: regular verbs (-ed)</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: говорить о прошлых действиях с правильными глаголами</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Чтобы сказать, что действие произошло <b>вчера/на прошлой неделе</b>, к глаголу добавляем <b>-ed</b>.</p>\n<p><b>Правила написания -ed:</b></p>\n<ul>\n<li>play → play<b>ed</b></li>\n<li>watch → watch<b>ed</b></li>\n<li>согласная + y → ied: study → stud<b>ied</b></li>\n<li>глагол на ударную гласную + согласную: stop → stop<b>ped</b> (удваиваем)</li>\n<li>dance → dance<b>d</b> (уже есть e, добавляем только d)</li>\n</ul>\n<div class=\"ex\" onclick=\"speak('I played football yesterday.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I played football yesterday.</span> — <span class=\"ru\">Я играл в футбол вчера.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I played football yesterday.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('She watched TV.', this)\" style=\"cursor: pointer;\"><span class=\"en\">She watched TV.</span> — <span class=\"ru\">Она смотрела ТВ.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('She watched TV.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('We studied English.', this)\" style=\"cursor: pointer;\"><span class=\"en\">We studied English.</span> — <span class=\"ru\">Мы учили английский.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('We studied English.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ -ed произносится по-разному: [d], [t], [ɪd]. Это нормально — нужно просто запомнить звучание.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"22\">\n<h4>Образуй Past Simple</h4>\n<ol>\n<li>play → <input class=\"ans\" data-a=\"played\"/></li>\n<li>watch → <input class=\"ans\" data-a=\"watched\"/></li>\n<li>study → <input class=\"ans\" data-a=\"studied\"/></li>\n<li>stop → <input class=\"ans\" data-a=\"stopped\"/></li>\n<li>dance → <input class=\"ans\" data-a=\"danced\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> 5 предложений: что ты делал вчера.</div>\n</section>"}, {"block": 2, "num": "23", "icon": "🖼️", "title": "Past Simple: отрицание и вопрос", "html": "<section class=\"lesson\" data-lesson=\"23\" id=\"l23\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">23</span><h2>Past Simple: отрицание и вопрос</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: строить отрицания и вопросы в Past Simple</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Отрицание:</b> didn't + глагол в начальной форме (без -ed!).</p>\n<div class=\"ex\" onclick=\"speak('I didn\\'t play.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I didn't play.</span> — <span class=\"ru\">Я не играл.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I didn\\'t play.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('She didn\\'t watch TV.', this)\" style=\"cursor: pointer;\"><span class=\"en\">She didn't watch TV.</span> — <span class=\"ru\">Она не смотрела ТВ.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('She didn\\'t watch TV.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Вопрос:</b> Did ставим в начало, глагол без -ed.</p>\n<div class=\"ex\" onclick=\"speak('Did you play football?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Did you play football?</span> — <span class=\"ru\">Ты играл в футбол?</span> — Yes, I did. / No, I didn't.<button class=\"play\" onclick=\"event.stopPropagation();speak('Did you play football?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('Did she watch TV?', this)\" style=\"cursor: pointer;\"><span class=\"en\">Did she watch TV?</span> — <span class=\"ru\">Она смотрела ТВ?</span><button class=\"play\" onclick=\"event.stopPropagation();speak('Did she watch TV?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ Когда появляется <b>did/didn't</b>, у глагола <b>исчезает -ed</b>: Did you <b>play</b>? (не played!)</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"23\">\n<h4>Вставь didn't / Did</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"didn't|didnt\"/> play.</li>\n<li><input class=\"ans\" data-a=\"did\"/> you watch TV?</li>\n<li>She <input class=\"ans\" data-a=\"didn't|didnt\"/> study.</li>\n<li><input class=\"ans\" data-a=\"did\"/> they play football?</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> 5 вопросов: Did you...?</div>\n</section>"}, {"block": 2, "num": "24", "icon": "💻", "title": "Практика: Past Simple (was/were, regular)", "html": "<section class=\"lesson\" data-lesson=\"24\" id=\"l24\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">24</span><h2>Практика: Past Simple (was/were, regular)</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: закрепить материал недель 4–6</p>\n<div class=\"rule\">\n<h3>📖 Повторение</h3>\n<p><b>Was/Were</b> — «был/были» · <b>-ed</b> — правильные глаголы в прошлом · <b>didn't / Did</b> — отрицание и вопрос.</p>\n</div>\n<div class=\"block\">\n<h3>Упражнение — перевод</h3>\n<div class=\"exercise\" data-lesson=\"24\">\n<ol>\n<li>Я был в школе вчера. → <input class=\"ans\" data-a=\"i was at school yesterday\" style=\"width:250px\"/></li>\n<li>Они были дома. → <input class=\"ans\" data-a=\"they were at home\" style=\"width:200px\"/></li>\n<li>Она не была в парке. → <input class=\"ans\" data-a=\"she wasn't at the park|she wasnt at the park\" style=\"width:230px\"/></li>\n<li>Я играл в футбол вчера. → <input class=\"ans\" data-a=\"i played football yesterday\" style=\"width:240px\"/></li>\n<li>Она смотрела ТВ. → <input class=\"ans\" data-a=\"she watched tv\" style=\"width:180px\"/></li>\n<li>Он не играл. → <input class=\"ans\" data-a=\"he didn't play|he didnt play\" style=\"width:180px\"/></li>\n<li>Ты смотрел ТВ? → <input class=\"ans\" data-a=\"did you watch tv\" style=\"width:180px\"/></li>\n<li>В комнате был стол. → <input class=\"ans\" data-a=\"there was a table in the room\" style=\"width:260px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> рассказ о прошлых выходных (7–10 предложений).</div>\n</section>"}, {"block": 3, "num": "25", "icon": "🏡", "title": "Неправильные глаголы (часть 1)", "html": "<section class=\"lesson\" data-lesson=\"25\" id=\"l25\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">25</span><h2>Неправильные глаголы (часть 1)</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: выучить 10 неправильных глаголов в трёх формах</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Неправильные глаголы</b> — не образуют Past Simple с -ed. У них своя форма, которую нужно <b>запомнить</b>.</p>\n<p>У каждого глагола <b>три формы</b>:</p>\n<ul>\n<li><b>V1</b> — инфинитив (go)</li>\n<li><b>V2</b> — Past Simple (went)</li>\n<li><b>V3</b> — Past Participle для Present Perfect (gone)</li>\n</ul>\n<div class=\"ex\" onclick=\"speak('I go to school every day.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I go to school every day.</span> — <span class=\"ru\">Я хожу в школу каждый день.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I go to school every day.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I went to the park yesterday.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I went to the park yesterday.</span> — <span class=\"ru\">Я пошёл в парк вчера.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I went to the park yesterday.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I have gone to the park.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I have gone to the park.</span> — <span class=\"ru\">Я уже сходил в парк.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I have gone to the park.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ Формы нужно учить сразу <b>всеми тремя</b>: go — went — gone.</div>\n</div>\n<div class=\"block\">\n<h3>Слова (нажми на карточку)</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">go — went — gone</span><span class=\"back\">идти</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">see — saw — seen</span><span class=\"back\">видеть</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">have — had — had</span><span class=\"back\">иметь</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">do — did — done</span><span class=\"back\">делать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">make — made — made</span><span class=\"back\">делать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">take — took — taken</span><span class=\"back\">брать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">give — gave — given</span><span class=\"back\">давать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">come — came — come</span><span class=\"back\">приходить</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">get — got — got</span><span class=\"back\">получать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">eat — ate — eaten</span><span class=\"back\">есть</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"25\">\n<h4>Вставь глагол в Past Simple (V2)</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"went\"/> (go) to the park.</li>\n<li>She <input class=\"ans\" data-a=\"saw\"/> (see) a film.</li>\n<li>He <input class=\"ans\" data-a=\"had\"/> (have) breakfast.</li>\n<li>They <input class=\"ans\" data-a=\"made\"/> (make) a cake.</li>\n<li>I <input class=\"ans\" data-a=\"took\"/> (take) a book.</li>\n<li>She <input class=\"ans\" data-a=\"gave\"/> (give) me a pen.</li>\n<li>He <input class=\"ans\" data-a=\"came\"/> (come) home.</li>\n<li>I <input class=\"ans\" data-a=\"got\"/> (get) a letter.</li>\n<li>She <input class=\"ans\" data-a=\"ate\"/> (eat) an apple.</li>\n<li>He <input class=\"ans\" data-a=\"did\"/> (do) his homework.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить 10 глаголов. Составить 5 предложений.</div>\n</section>"}, {"block": 3, "num": "26", "icon": "📖", "title": "Неправильные глаголы (часть 2)", "html": "<section class=\"lesson\" data-lesson=\"26\" id=\"l26\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">26</span><h2>Неправильные глаголы (часть 2)</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: выучить ещё 10 неправильных глаголов</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Ещё 10 неправильных глаголов. Помните: три формы — V1 (инфинитив), V2 (Past Simple), V3 (для Present Perfect).</p>\n<div class=\"ex\" onclick=\"speak('I drink milk every day.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I drink milk every day.</span> — V1<button class=\"play\" onclick=\"event.stopPropagation();speak('I drink milk every day.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I drank milk yesterday.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I drank milk yesterday.</span> — V2<button class=\"play\" onclick=\"event.stopPropagation();speak('I drank milk yesterday.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I have drunk milk.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I have drunk milk.</span> — V3 (Present Perfect)<button class=\"play\" onclick=\"event.stopPropagation();speak('I have drunk milk.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ У некоторых глаголов все три формы одинаковые: <b>put — put — put</b>, <b>read — read — read</b> (читается по-разному!).</div>\n</div>\n<div class=\"block\">\n<h3>Слова</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">drink — drank — drunk</span><span class=\"back\">пить</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">write — wrote — written</span><span class=\"back\">писать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">read — read — read</span><span class=\"back\">читать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">sing — sang — sung</span><span class=\"back\">петь</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">swim — swam — swum</span><span class=\"back\">плавать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">buy — bought — bought</span><span class=\"back\">покупать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">bring — brought — brought</span><span class=\"back\">приносить</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">think — thought — thought</span><span class=\"back\">думать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">know — knew — known</span><span class=\"back\">знать</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">put — put — put</span><span class=\"back\">класть</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"26\">\n<h4>Вставь глагол в Past Simple (V2)</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"drank\"/> (drink) milk.</li>\n<li>She <input class=\"ans\" data-a=\"wrote\"/> (write) a letter.</li>\n<li>He <input class=\"ans\" data-a=\"read\"/> (read) a book.</li>\n<li>They <input class=\"ans\" data-a=\"sang\"/> (sing) a song.</li>\n<li>We <input class=\"ans\" data-a=\"swam\"/> (swim) in the sea.</li>\n<li>I <input class=\"ans\" data-a=\"bought\"/> (buy) a book.</li>\n<li>She <input class=\"ans\" data-a=\"brought\"/> (bring) a cake.</li>\n<li>He <input class=\"ans\" data-a=\"thought\"/> (think) about it.</li>\n<li>I <input class=\"ans\" data-a=\"knew\"/> (know) the answer.</li>\n<li>She <input class=\"ans\" data-a=\"put\"/> (put) the book.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить 10 глаголов. Составить 5 предложений.</div>\n</section>"}, {"block": 3, "num": "27", "icon": "🧥", "title": "Практика: неправильные глаголы", "html": "<section class=\"lesson\" data-lesson=\"27\" id=\"l27\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">27</span><h2>Практика: неправильные глаголы</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: закрепить 20 неправильных глаголов</p>\n<div class=\"rule\">\n<h3>📖 Повторение</h3>\n<p>Используем V2 (Past Simple) для действий в прошлом:</p>\n<div class=\"ex\" onclick=\"speak('go → went, see → saw, have → had, drink → drank, write → wrote', this)\" style=\"cursor: pointer;\"><span class=\"en\">go → went, see → saw, have → had, drink → drank, write → wrote</span><button class=\"play\" onclick=\"event.stopPropagation();speak('go → went, see → saw, have → had, drink → drank, write → wrote', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Упражнение — перевод</h3>\n<div class=\"exercise\" data-lesson=\"27\">\n<ol>\n<li>Я пошёл в парк вчера. → <input class=\"ans\" data-a=\"i went to the park yesterday\" style=\"width:250px\"/></li>\n<li>Она увидела фильм. → <input class=\"ans\" data-a=\"she saw a film\" style=\"width:180px\"/></li>\n<li>Он сделал торт. → <input class=\"ans\" data-a=\"he made a cake\" style=\"width:170px\"/></li>\n<li>Я выпил молоко. → <input class=\"ans\" data-a=\"i drank milk\" style=\"width:160px\"/></li>\n<li>Она написала письмо. → <input class=\"ans\" data-a=\"she wrote a letter\" style=\"width:190px\"/></li>\n<li>Он прочитал книгу. → <input class=\"ans\" data-a=\"he read a book\" style=\"width:170px\"/></li>\n<li>Они спели песню. → <input class=\"ans\" data-a=\"they sang a song\" style=\"width:180px\"/></li>\n<li>Мы плавали в море. → <input class=\"ans\" data-a=\"we swam in the sea\" style=\"width:190px\"/></li>\n<li>Я купил книгу. → <input class=\"ans\" data-a=\"i bought a book\" style=\"width:170px\"/></li>\n<li>Она принесла торт. → <input class=\"ans\" data-a=\"she brought a cake\" style=\"width:200px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> повторить все 20 глаголов.</div>\n</section>"}, {"block": 3, "num": "28", "icon": "😴", "title": "Лексика: внешность и характер", "html": "<section class=\"lesson\" data-lesson=\"28\" id=\"l28\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">28</span><h2>Лексика: внешность и характер</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: описывать внешность и характер</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Чтобы описать человека:</p>\n<ul>\n<li><b>What does he look like?</b> — внешность (Как он выглядит?) → <b>has got</b> + внешность</li>\n<li><b>What is he like?</b> — характер (Какой он?) → <b>is</b> + характер</li>\n</ul>\n<div class=\"ex\" onclick=\"speak('She has got fair hair and blue eyes.', this)\" style=\"cursor: pointer;\"><span class=\"en\">She has got fair hair and blue eyes.</span> — <span class=\"ru\">У неё светлые волосы и голубые глаза.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('She has got fair hair and blue eyes.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('He is very friendly and clever.', this)\" style=\"cursor: pointer;\"><span class=\"en\">He is very friendly and clever.</span> — <span class=\"ru\">Он очень дружелюбный и умный.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('He is very friendly and clever.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ «What is he like?» — это про <b>характер</b>, а не «на что похож»!</div>\n</div>\n<div class=\"block\">\n<h3>Слова</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">fair hair</span><span class=\"back\">светлые волосы</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">dark hair</span><span class=\"back\">тёмные волосы</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">long hair</span><span class=\"back\">длинные волосы</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">short hair</span><span class=\"back\">короткие волосы</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">blue eyes</span><span class=\"back\">голубые глаза</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">slim</span><span class=\"back\">стройный</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">fat</span><span class=\"back\">толстый</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">tall</span><span class=\"back\">высокий</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">short</span><span class=\"back\">низкий</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">friendly</span><span class=\"back\">дружелюбный</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">clever</span><span class=\"back\">умный</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">funny</span><span class=\"back\">смешной</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">kind</span><span class=\"back\">добрый</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">naughty</span><span class=\"back\">непослушный</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">shy</span><span class=\"back\">застенчивый</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">brave</span><span class=\"back\">смелый</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"28\">\n<h4>Вставь слово по >mango, coconut, grapes</span> — <span class=\"ru\">фрукты</span><button class=\"play\" onclick=\"event.stopPropagation();speak('mango, coconut, grapes', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('beans, onion, green pepper', this)\" style=\"cursor: pointer;\"><span class=\"en\">beans, onion, green pepper</span> — <span class=\"ru\">овощи</span><button class=\"play\" onclick=\"event.stopPropagation();speak('beans, onion, green pepper', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('cheetah, whale, camel', this)\" style=\"cursor: pointer;\"><span class=\"en\">cheetah, whale, camel</span> — <span class=\"ru\">животные</span><button class=\"play\" onclick=\"event.stopPropagation();speak('cheetah, whale, camel', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Еда</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">mango</span><span class=\"back\">манго</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">coconut</span><span class=\"back\">кокос</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">olive oil</span><span class=\"back\">оливковое масло</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">beans</span><span class=\"back\">бобы</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">grapes</span><span class=\"back\">виноград</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">lemonade</span><span class=\"back\">лимонад</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">pizza</span><span class=\"back\">пицца</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">salad</span><span class=\"back\">салат</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">green pepper</span><span class=\"back\">зелёный перец</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">onion</span><span class=\"back\">лук</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">salt</span><span class=\"back\">соль</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">pepper</span><span class=\"back\">перец</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">pasta</span><span class=\"back\">макароны</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">rice</span><span class=\"back\">рис</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">burger</span><span class=\"back\">бургер</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Животные</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">panda</span><span class=\"back\">панда</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">tiger</span><span class=\"back\">тигр</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">cheetah</span><span class=\"back\">гепард</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">tortoise</span><span class=\"back\">черепаха</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">lizard</span><span class=\"back\">ящерица</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">parrot</span><span class=\"back\">попугай</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">kangaroo</span><span class=\"back\">кенгуру</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">bear</span><span class=\"back\">медведь</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">snail</span><span class=\"back\">улитка</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">whale</span><span class=\"back\">кит</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">camel</span><span class=\"back\">верблюд</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">gorilla</span><span class=\"back\">горилла</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">python</span><span class=\"back\">питон</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"32\">\n<h4>Выбери категорию</h4>\n<p>1. mango — это...</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l32a\" type=\"radio\"/> фрукт</label>\n<label class=\"choice\"><input name=\"l32a\" type=\"radio\"/> животное</label>\n<p style=\"margin-top:12px\">2. cheetah — это...</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l32b\" type=\"radio\"/> животное</label>\n<label class=\"choice\"><input name=\"l32b\" type=\"radio\"/> еда</label>\n<p style=\"margin-top:12px\">3. onion — это...</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l32c\" type=\"radio\"/> овощ</label>\n<label class=\"choice\"><input name=\"l32c\" type=\"radio\"/> фрукт</label>\n<button class=\"check-btn\" onclick=\"checkRadios(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить слова. Написать о любимой еде и животном.</div>\n</section>"}, {"block": 3, "num": "33", "icon": "🥛", "title": "Comparatives", "html": "<section class=\"lesson\" data-lesson=\"33\" id=\"l33\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">33</span><h2>Comparatives</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: сравнивать предметы и людей</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Сравнительная степень</b> — когда сравниваем <b>два</b> предмета: «больше, чем...».</p>\n<p><b>Короткие прилагательные:</b> + <b>-er</b> + <b>than</b>.</p>\n<div class=\"ex\" onclick=\"speak('tall → taller', this)\" style=\"cursor: pointer;\"><span class=\"en\">tall → taller</span> — <span class=\"ru\">выше</span><button class=\"play\" onclick=\"event.stopPropagation();speak('tall → taller', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('big → bigger', this)\" style=\"cursor: pointer;\"><span class=\"en\">big → bigger</span> (удваиваем согласную) — <span class=\"ru\">больше</span><button class=\"play\" onclick=\"event.stopPropagation();speak('big → bigger', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('fast → faster', this)\" style=\"cursor: pointer;\"><span class=\"en\">fast → faster</span> — <span class=\"ru\">быстрее</span><button class=\"play\" onclick=\"event.stopPropagation();speak('fast → faster', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Исключения:</b></p>\n<div class=\"ex\" onclick=\"speak('good → better', this)\" style=\"cursor: pointer;\"><span class=\"en\">good → better</span> — <span class=\"ru\">лучше</span><button class=\"play\" onclick=\"event.stopPropagation();speak('good → better', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('bad → worse', this)\" style=\"cursor: pointer;\"><span class=\"en\">bad → worse</span> — <span class=\"ru\">хуже</span><button class=\"play\" onclick=\"event.stopPropagation();speak('bad → worse', this)\" title=\"Прослушать\">🔊</button></div>\n<p>Пример:</p>\n<div class=\"ex\" onclick=\"speak('The cheetah is faster than the lion.', this)\" style=\"cursor: pointer;\"><span class=\"en\">The cheetah is faster than the lion.</span> — <span class=\"ru\">Гепард быстрее льва.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('The cheetah is faster than the lion.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ После сравнительной степени всегда <b>than</b>: taller <b>than</b> me.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"33\">\n<h4>Образуй сравнительную степень</h4>\n<ol>\n<li>tall → <input class=\"ans\" data-a=\"taller\"/></li>\n<li>big → <input class=\"ans\" data-a=\"bigger\"/></li>\n<li>short → <input class=\"ans\" data-a=\"shorter\"/></li>\n<li>fast → <input class=\"ans\" data-a=\"faster\"/></li>\n<li>good → <input class=\"ans\" data-a=\"better\"/></li>\n<li>bad → <input class=\"ans\" data-a=\"worse\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> сравнить членов семьи.</div>\n</section>"}, {"block": 3, "num": "34", "icon": "❓", "title": "Superlatives", "html": "<section class=\"lesson\" data-lesson=\"34\" id=\"l34\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">34</span><h2>Superlatives</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: говорить о самом-самом</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Превосходная степень</b> — «самый...» (среди всех).</p>\n<p><b>Короткие прилагательные:</b> <b>the</b> + прилагательное + <b>-est</b>.</p>\n<div class=\"ex\" onclick=\"speak('tall → the tallest', this)\" style=\"cursor: pointer;\"><span class=\"en\">tall → the tallest</span> — <span class=\"ru\">самый высокий</span><button class=\"play\" onclick=\"event.stopPropagation();speak('tall → the tallest', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('big → the biggest', this)\" style=\"cursor: pointer;\"><span class=\"en\">big → the biggest</span> — <span class=\"ru\">самый большой</span><button class=\"play\" onclick=\"event.stopPropagation();speak('big → the biggest', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Исключения:</b></p>\n<div class=\"ex\" onclick=\"speak('good → the best', this)\" style=\"cursor: pointer;\"><span class=\"en\">good → the best</span> — <span class=\"ru\">самый лучший</span><button class=\"play\" onclick=\"event.stopPropagation();speak('good → the best', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('bad → the worst', this)\" style=\"cursor: pointer;\"><span class=\"en\">bad → the worst</span> — <span class=\"ru\">самый плохой</span><button class=\"play\" onclick=\"event.stopPropagation();speak('bad → the worst', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('The whale is the largest animal.', this)\" style=\"cursor: pointer;\"><span class=\"en\">The whale is the largest animal.</span> — <span class=\"ru\">Кит — самое большое животное.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('The whale is the largest animal.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ Перед превосходной степенью <b>всегда the</b>!</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"34\">\n<h4>Образуй превосходную степень (пиши с \"the\")</h4>\n<ol>\n<li>tall → <input class=\"ans\" data-a=\"the tallest\" style=\"width:140px\"/></li>\n<li>big → <input class=\"ans\" data-a=\"the biggest\" style=\"width:140px\"/></li>\n<li>fast → <input class=\"ans\" data-a=\"the fastest\" style=\"width:140px\"/></li>\n<li>good → <input class=\"ans\" data-a=\"the best\" style=\"width:140px\"/></li>\n<li>bad → <input class=\"ans\" data-a=\"the worst\" style=\"width:140px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> написать о самом-самом.</div>\n</section>"}, {"block": 3, "num": "35", "icon": "⚖️", "title": "Модальные глаголы: Must, Have to, Should", "html": "<section class=\"lesson\" data-lesson=\"35\" id=\"l35\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">35</span><h2>Модальные глаголы: Must, Have to, Should</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: говорить о правилах, обязанностях и советах</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>После модальных глаголов — <b>глагол без to и без окончаний</b>.</p>\n<table>\n<tr><th>Глагол</th><th>Когда использовать</th><th>Пример</th></tr>\n<tr><td><b>must</b></td><td>должен (сильное правило)</td><td>You must wear a helmet.</td></tr>\n<tr><td><b>mustn't</b></td><td>нельзя (запрет)</td><td>You mustn't drop litter.</td></tr>\n<tr><td><b>have to</b></td><td>приходится (обстоятельства)</td><td>I have to help my mum.</td></tr>\n<tr><td><b>don't have to</b></td><td>не обязательно</td><td>I don't have to get up early.</td></tr>\n<tr><td><b>should</b></td><td>следует (совет)</td><td>You should go to the doctor.</td></tr>\n<tr><td><b>shouldn't</b></td><td>не следует (совет)</td><td>You shouldn't eat sweets.</td></tr>\n</table>\n<div class=\"ex\" onclick=\"speak('You should take cough syrup.', this)\" style=\"cursor: pointer;\"><span class=\"en\">You should take cough syrup.</span> — <span class=\"ru\">Тебе следует принять сироп от кашля.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('You should take cough syrup.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ После must, should, can — <b>никогда to</b>: You must wear (не to wear!)</div>\n</div>\n<div class=\"block\">\n<h3>Упражнения</h3>\n<div class=\"exercise\" data-lesson=\"35\">\n<h4>Упражнение 1. Вставь must / mustn't</h4>\n<ol>\n<li>You <input class=\"ans\" data-a=\"must\"/> wear a helmet.</li>\n<li>You <input class=\"ans\" data-a=\"mustn't|mustnt\"/> drop litter.</li>\n<li>You <input class=\"ans\" data-a=\"must\"/> wear a seatbelt.</li>\n<li>You <input class=\"ans\" data-a=\"mustn't|mustnt\"/> be late.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n<div class=\"exercise\" data-lesson=\"35\">\n<h4>Упражнение 2. Вставь should / shouldn't</h4>\n<ol>\n<li>You <input class=\"ans\" data-a=\"should\"/> go to the doctor.</li>\n<li>You <input class=\"ans\" data-a=\"shouldn't|shouldnt\"/> eat sweets.</li>\n<li>You <input class=\"ans\" data-a=\"should\"/> take cough syrup.</li>\n<li>You <input class=\"ans\" data-a=\"shouldn't|shouldnt\"/> go outside.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> написать 5 правил для школы.</div>\n</section>"}, {"block": 3, "num": "36", "icon": "🔢", "title": "Will, Going to, Present Perfect", "html": "<section class=\"lesson\" data-lesson=\"36\" id=\"l36\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">36</span><h2>Will, Going to, Present Perfect</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: познакомиться с будущим временем и Present Perfect</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Will</b> — решение сейчас, обещание.</p>\n<div class=\"ex\" onclick=\"speak('I will help you.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I will help you.</span> — <span class=\"ru\">Я помогу тебе.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I will help you.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Going to</b> — план заранее.</p>\n<div class=\"ex\" onclick=\"speak('I am going to visit my grandma.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I am going to visit my grandma.</span> — <span class=\"ru\">Я собираюсь навестить бабушку.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I am going to visit my grandma.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Present Perfect</b> — have/has + V3. Действие в прошлом, но важен <b>результат</b> сейчас.</p>\n<div class=\"ex\" onclick=\"speak('I have lived in Russia.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I have lived in Russia.</span> — <span class=\"ru\">Я живу в России (и сейчас живу).</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I have lived in Russia.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('She has done her homework.', this)\" style=\"cursor: pointer;\"><span class=\"en\">She has done her homework.</span> — <span class=\"ru\">Она сделала домашнюю работу.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('She has done her homework.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"warn\">⚠️ Слова-подсказки Present Perfect: <b>already, yet, ever, never, just</b>.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнения</h3>\n<div class=\"exercise\" data-lesson=\"36\">\n<h4>Упражнение 1. Вставь will / won't</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"will\"/> go to the park.</li>\n<li>I <input class=\"ans\" data-a=\"will\"/> not watch TV.</li>\n<li>She <input class=\"ans\" data-a=\"will\"/> come tomorrow.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n<div class=\"exercise\" data-lesson=\"36\">\n<h4>Упражнение 2. Вставь have / has</h4>\n<ol>\n<li>I <input class=\"ans\" data-a=\"have\"/> lived in Russia.</li>\n<li>She <input class=\"ans\" data-a=\"has\"/> done her homework.</li>\n<li>They <input class=\"ans\" data-a=\"have\"/> been to England.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> написать планы на выходные.</div>\n</section>"}, {"block": 4, "num": "37", "icon": "⏰", "title": "Повторение: Present Simple vs Present Continuous", "html": "<section class=\"lesson\" data-lesson=\"37\" id=\"l37\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">37</span><h2>Повторение: Present Simple vs Present Continuous</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: закрепить разницу между «обычно» и «сейчас»</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Present Simple</b> — что делаем <b>обычно, каждый день</b>.</p>\n<p><b>Present Continuous</b> — что делаем <b>прямо сейчас</b>.</p>\n<table>\n<tr><th>Present Simple</th><th>Present Continuous</th></tr>\n<tr><td>usually, every day, always</td><td>now, at the moment, today</td></tr>\n<tr><td>I play football every day.</td><td>I am playing football now.</td></tr>\n<tr><td>She goes to school.</td><td>She is going to school now.</td></tr>\n</table>\n<div class=\"warn\">⚠️ Если видишь <b>now / look! / at the moment</b> — почти всегда Present Continuous.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"37\">\n<p>1. I (play / am playing) now.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l37a\" type=\"radio\"/> am playing</label>\n<label class=\"choice\"><input name=\"l37a\" type=\"radio\"/> play</label>\n<p style=\"margin-top:12px\">2. She (plays / is playing) every day.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l37b\" type=\"radio\"/> plays</label>\n<label class=\"choice\"><input name=\"l37b\" type=\"radio\"/> is playing</label>\n<p style=\"margin-top:12px\">3. They (read / are reading) at the moment.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l37c\" type=\"radio\"/> are reading</label>\n<label class=\"choice\"><input name=\"l37c\" type=\"radio\"/> read</label>\n<p style=\"margin-top:12px\">4. He usually (goes / is going) to school.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l37d\" type=\"radio\"/> goes</label>\n<label class=\"choice\"><input name=\"l37d\" type=\"radio\"/> is going</label>\n<p style=\"margin-top:12px\">5. Look! The cat (sleeps / is sleeping).</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l37e\" type=\"radio\"/> is sleeping</label>\n<label class=\"choice\"><input name=\"l37e\" type=\"radio\"/> sleeps</label>\n<button class=\"check-btn\" onclick=\"checkRadios(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> составить 10 предложений (5 PS, 5 PC).</div>\n</section>"}, {"block": 4, "num": "38", "icon": "👜", "title": "Повторение: Past Simple vs Present Perfect", "html": "<section class=\"lesson\" data-lesson=\"38\" id=\"l38\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">38</span><h2>Повторение: Past Simple vs Present Perfect</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: закрепить разницу между «вчера» и «уже»</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p><b>Past Simple</b> — конкретное время в прошлом (yesterday, last week).</p>\n<p><b>Present Perfect</b> — важна не дата, а <b>результат</b> сейчас (already, yet, ever, never).</p>\n<table>\n<tr><th>Past Simple</th><th>Present Perfect</th></tr>\n<tr><td>yesterday, last week, two days ago</td><td>already, yet, ever, never, just</td></tr>\n<tr><td>I played football yesterday.</td><td>I have already played football.</td></tr>\n<tr><td>She saw this film last Sunday.</td><td>She has seen this film.</td></tr>\n</table>\n<div class=\"warn\">⚠️ Если есть точное время (yesterday, в 5 часов) — <b>только Past Simple</b>!</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"38\">\n<p>1. I (played / have played) football yesterday.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l38a\" type=\"radio\"/> played</label>\n<label class=\"choice\"><input name=\"l38a\" type=\"radio\"/> have played</label>\n<p style=\"margin-top:12px\">2. She (did / has done) her homework.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l38b\" type=\"radio\"/> has done</label>\n<label class=\"choice\"><input name=\"l38b\" type=\"radio\"/> did</label>\n<p style=\"margin-top:12px\">3. They (went / have gone) to the park last Sunday.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l38c\" type=\"radio\"/> went</label>\n<label class=\"choice\"><input name=\"l38c\" type=\"radio\"/> have gone</label>\n<p style=\"margin-top:12px\">4. He (saw / has seen) this film.</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l38d\" type=\"radio\"/> has seen</label>\n<label class=\"choice\"><input name=\"l38d\" type=\"radio\"/> saw</label>\n<button class=\"check-btn\" onclick=\"checkRadios(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> составить 10 предложений.</div>\n</section>"}, {"block": 4, "num": "39", "icon": "🎁", "title": "Повторение: Will vs Going to", "html": "<section class=\"lesson\" data-lesson=\"39\" id=\"l39\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">39</span><h2>Повторение: Will vs Going to</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: закрепить разницу между «решил сейчас» и «планировал»</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<table>\n<tr><th>Will</th><th>Going to</th></tr>\n<tr><td>Решение <b>сейчас</b>, спонтанное</td><td>План <b>заранее</b></td></tr>\n<tr><td>It's cold. I will close the window.</td><td>I am going to visit my grandma tomorrow.</td></tr>\n<tr><td>I will help you.</td><td>She is going to play football on Sunday.</td></tr>\n</table>\n<div class=\"ex\" onclick=\"speak('I will help you.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I will help you.</span> — <span class=\"ru\">Я помогу тебе (только что решил).</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I will help you.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I am going to visit my grandma.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I am going to visit my grandma.</span> — <span class=\"ru\">Я собираюсь навестить бабушку (планировал).</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I am going to visit my grandma.', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"39\">\n<p>1. It's cold. I (will / am going to) close the window. (решение сейчас)</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l39a\" type=\"radio\"/> will</label>\n<label class=\"choice\"><input name=\"l39a\" type=\"radio\"/> am going to</label>\n<p style=\"margin-top:12px\">2. I (will / am going to) visit my grandma tomorrow. (план)</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l39b\" type=\"radio\"/> am going to</label>\n<label class=\"choice\"><input name=\"l39b\" type=\"radio\"/> will</label>\n<p style=\"margin-top:12px\">3. She (will / is going to) play football on Sunday. (план)</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l39c\" type=\"radio\"/> is going to</label>\n<label class=\"choice\"><input name=\"l39c\" type=\"radio\"/> will</label>\n<p style=\"margin-top:12px\">4. I (will / am going to) help you. (решение сейчас)</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l39d\" type=\"radio\"/> will</label>\n<label class=\"choice\"><input name=\"l39d\" type=\"radio\"/> am going to</label>\n<button class=\"check-btn\" onclick=\"checkRadios(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> составить 10 предложений.</div>\n</section>"}, {"block": 4, "num": "40", "icon": "🎒", "title": "Повторение: все времена", "html": "<section class=\"lesson\" data-lesson=\"40\" id=\"l40\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">40</span><h2>Повторение: все времена</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: систематизировать все времена</p>\n<div class=\"rule\">\n<h3>📖 Сводная таблица</h3>\n<table>\n<tr><th>Время</th><th>Утверждение</th><th>Отрицание</th><th>Вопрос</th></tr>\n<tr><td>Present Simple</td><td>I play</td><td>I don't play</td><td>Do you play?</td></tr>\n<tr><td>Present Continuous</td><td>I am playing</td><td>I am not playing</td><td>Are you playing?</td></tr>\n<tr><td>Past Simple</td><td>I played</td><td>I didn't play</td><td>Did you play?</td></tr>\n<tr><td>Future Simple</td><td>I will play</td><td>I won't play</td><td>Will you play?</td></tr>\n<tr><td>Present Perfect</td><td>I have played</td><td>I haven't played</td><td>Have you played?</td></tr>\n</table>\n<div class=\"warn\">⚠️ Обращай внимание на <b>слова-подсказки</b>: every day → PS, now → PC, yesterday → Past, tomorrow → Future, already → PP.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение — определи время</h3>\n<div class=\"exercise\" data-lesson=\"40\">\n<ol>\n<li>I play football every day. — <input class=\"ans\" data-a=\"present simple|present\" style=\"width:150px\"/></li>\n<li>I am playing football now. — <input class=\"ans\" data-a=\"present continuous\" style=\"width:180px\"/></li>\n<li>I played football yesterday. — <input class=\"ans\" data-a=\"past simple|past\" style=\"width:130px\"/></li>\n<li>I will play football tomorrow. — <input class=\"ans\" data-a=\"future simple|future\" style=\"width:150px\"/></li>\n<li>I have played football. — <input class=\"ans\" data-a=\"present perfect\" style=\"width:170px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> повторить таблицу.</div>\n</section>"}, {"block": 4, "num": "41", "icon": "🐘", "title": "Лексика: магазины и здания", "html": "<section class=\"lesson\" data-lesson=\"41\" id=\"l41\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">41</span><h2>Лексика: магазины и здания</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: выучить названия магазинов и зданий</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Когда говорим, куда идём и <b>зачем</b>: <b>I go to the... to...</b> (Я хожу в... чтобы...).</p>\n<div class=\"ex\" onclick=\"speak('I go to the supermarket to buy food.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I go to the supermarket to buy food.</span> — <span class=\"ru\">Я хожу в супермаркет, чтобы купить еду.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I go to the supermarket to buy food.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('You send letters at the post office.', this)\" style=\"cursor: pointer;\"><span class=\"en\">You send letters at the post office.</span> — <span class=\"ru\">Ты отправляешь письма на почте.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('You send letters at the post office.', this)\" title=\"Прослушать\">🔊</button></div>\n<p><b>Обрати внимание:</b> у многих магазинов есть <b>'s</b> на конце (baker's, butcher's, greengrocer's).</p>\n</div>\n<div class=\"block\">\n<h3>Слова</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">post office</span><span class=\"back\">почта</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">baker's</span><span class=\"back\">булочная</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">butcher's</span><span class=\"back\">мясной магазин</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">greengrocer's</span><span class=\"back\">овощной магазин</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">police station</span><span class=\"back\">полицейский участок</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">restaurant</span><span class=\"back\">ресторан</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">cinema</span><span class=\"back\">кинотеатр</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">supermarket</span><span class=\"back\">супермаркет</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">hotel</span><span class=\"back\">отель</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">bank</span><span class=\"back\">банк</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">hospital</span><span class=\"back\">больница</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">school</span><span class=\"back\">школа</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">park</span><span class=\"back\">парк</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"41\">\n<h4>Соотнеси — где что делают</h4>\n<ol>\n<li>You buy bread at the... — <input class=\"ans\" data-a=\"baker's|bakers\" style=\"width:130px\"/></li>\n<li>You buy meat at the... — <input class=\"ans\" data-a=\"butcher's|butchers\" style=\"width:130px\"/></li>\n<li>You buy vegetables at the... — <input class=\"ans\" data-a=\"greengrocer's|greengrocers\" style=\"width:160px\"/></li>\n<li>You send letters at the... — <input class=\"ans\" data-a=\"post office\" style=\"width:130px\"/></li>\n<li>You watch films at the... — <input class=\"ans\" data-a=\"cinema\" style=\"width:110px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить слова. 5 предложений.</div>\n</section>"}, {"block": 4, "num": "42", "icon": "🦒", "title": "Лексика: здоровье", "html": "<section class=\"lesson\" data-lesson=\"42\" id=\"l42\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">42</span><h2>Лексика: здоровье</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: выучить слова по теме «Здоровье»</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Чтобы спросить о самочувствии: <b>What's the matter?</b> — Что случилось?</p>\n<p>Ответ: <b>I have got a...</b> (У меня болит...).</p>\n<p>Совет: <b>You should...</b> (Тебе следует...).</p>\n<div class=\"ex\" onclick=\"speak('What\\'s the matter?', this)\" style=\"cursor: pointer;\"><span class=\"en\">What's the matter?</span> — <span class=\"ru\">Что случилось?</span><button class=\"play\" onclick=\"event.stopPropagation();speak('What\\'s the matter?', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('I have got a headache.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I have got a headache.</span> — <span class=\"ru\">У меня болит голова.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I have got a headache.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('You should take an aspirin.', this)\" style=\"cursor: pointer;\"><span class=\"en\">You should take an aspirin.</span> — <span class=\"ru\">Тебе следует принять аспирин.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('You should take an aspirin.', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Слова</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">toothache</span><span class=\"back\">зубная боль</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">headache</span><span class=\"back\">головная боль</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">stomachache</span><span class=\"back\">боль в животе</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">cold</span><span class=\"back\">простуда</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">rash</span><span class=\"back\">сыпь</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">cough</span><span class=\"back\">кашель</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">cough syrup</span><span class=\"back\">сироп от кашля</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">aspirin</span><span class=\"back\">аспирин</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">skin cream</span><span class=\"back\">крем для кожи</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"42\">\n<h4>Соотнеси проблему и совет</h4>\n<ol>\n<li>I have got a toothache. — You should go to the <input class=\"ans\" data-a=\"dentist|dentist's|dentists\" style=\"width:120px\"/>.</li>\n<li>I have got a headache. — You should take an <input class=\"ans\" data-a=\"aspirin\" style=\"width:110px\"/>.</li>\n<li>I have got a cold. — You should take <input class=\"ans\" data-a=\"cough syrup\" style=\"width:120px\"/>.</li>\n<li>I have got a rash. — You should put some <input class=\"ans\" data-a=\"skin cream\" style=\"width:120px\"/>.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить слова. Написать диалог.</div>\n</section>"}, {"block": 4, "num": "43", "icon": "⚖️", "title": "Лексика: профессии и животные", "html": "<section class=\"lesson\" data-lesson=\"43\" id=\"l43\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">43</span><h2>Лексика: профессии и животные</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: повторить профессии и животных</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>О животном можно рассказать: <b>It lives in..., it eats..., it can...</b></p>\n<div class=\"ex\" onclick=\"speak('A whale lives in the ocean.', this)\" style=\"cursor: pointer;\"><span class=\"en\">A whale lives in the ocean.</span> — <span class=\"ru\">Кит живёт в океане.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('A whale lives in the ocean.', this)\" title=\"Прослушать\">🔊</button></div>\n<div class=\"ex\" onclick=\"speak('A camel lives in the desert.', this)\" style=\"cursor: pointer;\"><span class=\"en\">A camel lives in the desert.</span> — <span class=\"ru\">Верблюд живёт в пустыне.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('A camel lives in the desert.', this)\" title=\"Прослушать\">🔊</button></div>\n<p>О профессии: <b>He/She works as a...</b> + <b>He/She</b> + что делает.</p>\n<div class=\"ex\" onclick=\"speak('A writer writes books.', this)\" style=\"cursor: pointer;\"><span class=\"en\">A writer writes books.</span> — <span class=\"ru\">Писатель пишет книги.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('A writer writes books.', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Профессии и среда обитания</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">nurse</span><span class=\"back\">медсестра</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">writer</span><span class=\"back\">писатель</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">artist</span><span class=\"back\">художник</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">composer</span><span class=\"back\">композитор</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">athlete</span><span class=\"back\">спортсмен</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">actor</span><span class=\"back\">актёр</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">actress</span><span class=\"back\">актриса</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">rainforest</span><span class=\"back\">тропический лес</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">desert</span><span class=\"back\">пустыня</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">jungle</span><span class=\"back\">джунгли</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">grassland</span><span class=\"back\">саванна</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">ocean</span><span class=\"back\">океан</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">whale</span><span class=\"back\">кит</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">camel</span><span class=\"back\">верблюд</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">gorilla</span><span class=\"back\">горилла</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">python</span><span class=\"back\">питон</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"43\">\n<p>1. A writer... </p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l43a\" type=\"radio\"/> writes books</label>\n<label class=\"choice\"><input name=\"l43a\" type=\"radio\"/> fixes cars</label>\n<p style=\"margin-top:12px\">2. A whale lives in the...</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l43b\" type=\"radio\"/> ocean</label>\n<label class=\"choice\"><input name=\"l43b\" type=\"radio\"/> desert</label>\n<p style=\"margin-top:12px\">3. A camel lives in the...</p>\n<label class=\"choice\"><input data-correct=\"true\" name=\"l43c\" type=\"radio\"/> desert</label>\n<label class=\"choice\"><input name=\"l43c\" type=\"radio\"/> rainforest</label>\n<button class=\"check-btn\" onclick=\"checkRadios(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить слова. Написать о профессии мечты.</div>\n</section>"}, {"block": 4, "num": "44", "icon": "⭐", "title": "Лексика: еда и путешествия", "html": "<section class=\"lesson\" data-lesson=\"44\" id=\"l44\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">44</span><h2>Лексика: еда и путешествия</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: повторить еду и выучить слова для путешествий</p>\n<div class=\"rule\">\n<h3>📖 Правило</h3>\n<p>Когда собираемся в поездку: <b>I take... on holiday.</b> (Я беру с собой...)</p>\n<div class=\"ex\" onclick=\"speak('I take a swimsuit and sunglasses on holiday.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I take a swimsuit and sunglasses on holiday.</span> — <span class=\"ru\">Я беру купальник и очки в отпуск.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I take a swimsuit and sunglasses on holiday.', this)\" title=\"Прослушать\">🔊</button></div>\n<p>О еде: <b>I like... / My favourite food is...</b></p>\n<div class=\"ex\" onclick=\"speak('I like pizza and salad.', this)\" style=\"cursor: pointer;\"><span class=\"en\">I like pizza and salad.</span> — <span class=\"ru\">Я люблю пиццу и салат.</span><button class=\"play\" onclick=\"event.stopPropagation();speak('I like pizza and salad.', this)\" title=\"Прослушать\">🔊</button></div>\n</div>\n<div class=\"block\">\n<h3>Слова</h3>\n<div class=\"flip-cards\">\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">swimsuit</span><span class=\"back\">купальник</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">swimming trunks</span><span class=\"back\">плавки</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">sandals</span><span class=\"back\">сандалии</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">sleeping bag</span><span class=\"back\">спальный мешок</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">sunglasses</span><span class=\"back\">очки от солнца</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">sun cream</span><span class=\"back\">крем от солнца</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">rucksack</span><span class=\"back\">рюкзак</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">tent</span><span class=\"back\">палатка</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">map</span><span class=\"back\">карта</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">souvenir</span><span class=\"back\">сувенир</span></div>\n<div class=\"flip\" onclick=\"this.classList.toggle('flipped')\"><span class=\"front\">wetsuit</span><span class=\"back\">гидрокостюм</span></div>\n</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"44\">\n<h4>Впиши подходящее слово</h4>\n<ol>\n<li>Я беру это, чтобы плавать: <input class=\"ans\" data-a=\"swimsuit|swimming trunks\" style=\"width:170px\"/></li>\n<li>Я беру это от солнца: <input class=\"ans\" data-a=\"sun cream\" style=\"width:130px\"/></li>\n<li>Я сплю в этом на природе: <input class=\"ans\" data-a=\"sleeping bag\" style=\"width:150px\"/></li>\n<li>Я смотрю на это, чтобы не заблудиться: <input class=\"ans\" data-a=\"map\" style=\"width:100px\"/></li>\n<li>Я везу это домой в подарок: <input class=\"ans\" data-a=\"souvenir\" style=\"width:130px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> выучить слова. Собрать список для путешествия.</div>\n</section>"}, {"block": 4, "num": "45", "icon": "🐎", "title": "Чтение: сказка «Каменный цветок»", "html": "<section class=\"lesson\" data-lesson=\"45\" id=\"l45\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">45</span><h2>Чтение: сказка «Каменный цветок»</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: читать с полным пониманием</p>\n<div class=\"rule\">\n<h3>📖 Как работать с текстом</h3>\n<ol>\n<li>Прочитай текст <b>про себя</b> — пойми общий смысл.</li>\n<li>Найди незнакомые слова — догадайся по контексту.</li>\n<li>Прочитай ещё раз внимательно — ответь на вопросы.</li>\n<li>Обращай внимание на <b>время глаголов</b> (Past Simple).</li>\n</ol>\n</div>\n<div class=\"block\">\n<h3>Текст</h3>\n<div class=\"text-box\">\n      One day, Prokopych runs home very excited:<br/><br/>\n      \"A very rich man from the village wants you to make him a vase! Look, here is a drawing of what he wants!\"<br/><br/>\n      Danila can see how much this means to Prokopych. He wants to make something very special, but he is not happy with the drawing.<br/><br/>\n      \"This drawing has no life in it. I need to look at something that has life in it.\"<br/><br/>\n      He goes to the woods to look at the plants and flowers, hoping to get some ideas. He works day and night on the vase. He wants it to be the best vase in the Urals.\n    </div>\n</div>\n<div class=\"block\">\n<h3>Упражнение — ответь на вопросы</h3>\n<div class=\"exercise\" data-lesson=\"45\">\n<ol>\n<li>What does the rich man want? — <input class=\"ans\" data-a=\"a vase|vase\" style=\"width:110px\"/></li>\n<li>Why is Danila not happy? — The drawing has no <input class=\"ans\" data-a=\"life\" style=\"width:90px\"/></li>\n<li>Where does Danila go? — To the <input class=\"ans\" data-a=\"woods\" style=\"width:110px\"/></li>\n<li>What does he want to make? — The best <input class=\"ans\" data-a=\"vase\" style=\"width:100px\"/> in the Urals.</li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> пересказ сказки.</div>\n</section>"}, {"block": 4, "num": "46", "icon": "🏛️", "title": "Аудирование: комиксы и диалоги", "html": "<section class=\"lesson\" data-lesson=\"46\" id=\"l46\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">46</span><h2>Аудирование: комиксы и диалоги</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: понимать речь на слух</p>\n<div class=\"rule\">\n<h3>📖 Как слушать</h3>\n<ol>\n<li>Прочитай вопрос — что нужно услышать?</li>\n<li>Слушай <b>весь</b> текст — не пытайся перевести каждое слово.</li>\n<li>Обращай внимание на <b>ключевые слова</b>.</li>\n<li>После прослушивания проверь себя.</li>\n</ol>\n</div>\n<div class=\"block\">\n<h3>Диалоги (читай вслух или слушай)</h3>\n<div class=\"text-box\">— What are you doing?<br/>— I am playing football.<br/>— Can I play with you?<br/>— Yes, of course!</div>\n<div class=\"text-box\">— Where are you going?<br/>— I am going to the park.<br/>— What will you do there?<br/>— I will play with my friends.</div>\n<div class=\"text-box\">— What did you do yesterday?<br/>— I went to the cinema.<br/>— What did you see?<br/>— I saw a funny film.</div>\n</div>\n<div class=\"block\">\n<h3>Упражнение</h3>\n<div class=\"exercise\" data-lesson=\"46\">\n<ol>\n<li>What is he doing? — He is playing <input class=\"ans\" data-a=\"football\" style=\"width:120px\"/></li>\n<li>Where is he going? — To the <input class=\"ans\" data-a=\"park\" style=\"width:90px\"/></li>\n<li>What did he do yesterday? — He went to the <input class=\"ans\" data-a=\"cinema\" style=\"width:110px\"/></li>\n<li>What did he see? — A funny <input class=\"ans\" data-a=\"film\" style=\"width:100px\"/></li>\n</ol>\n<button class=\"check-btn\" onclick=\"checkInputs(this)\">Проверить</button>\n<div class=\"feedback\"></div>\n</div>\n</div>\n<div class=\"hw\"><strong>📝 ДЗ:</strong> разыграть диалоги по ролям.</div>\n</section>"}, {"block": 4, "num": "47", "icon": "🏰", "title": "Чтение: тексты о странах", "html": "<section class=\"lesson\" data-lesson=\"47\" id=\"l47\">\n<div class=\"lesson-head\"><span class=\"lesson-num\">47</span><h2>Чтение: тексты о странах</h2><span class=\"done-badge\">✓</span></div>\n<p class=\"goal\">🎯 Цель: читать и сравнивать информацию</p>\n<div class=\"rule\">\n<h3>📖 Полезные слова для рассказа о стране</h3>\n<ul>\n<li><b>capital</b> — столица</li>\n<li><b>famous places</b> — известные места</li>\n<li><b>traditional food</b> — традиционная еда</li>\n<li><b>people are...</b> — люди (какие?)</li>\n</ul>\n</div>\n<div class=\"block\">\n<h3>Russia</h3>\n<div class=\"text-box\">Russia is a big country. The capital of Russia is Moscow. There are many beautiful places in Russia: Red Square, the Bolshoi Theatre, the Kremlin. People in Russia eat borsch, pancakes and kasha. Russian people are friendly and kind.</div>\n<h3>The UK</h3>\n<div class=\"text-box\">The UK is a country in Europe. The capital of the UK is London. There are many bea
